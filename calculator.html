<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <div class="calculating-area">
      <h3>Calculator</h3>

      <p class="js-cal-result result"></p>

      <p>
        <button class="button1" onclick="
          updateCalculation('1');
        ">1</button>

        <button class="button1" onclick="
          updateCalculation('2');
        ">2</button>

        <button class="button1" onclick="
          updateCalculation('3');
        ">3</button>
      
        <button class="button2" onclick="
          updateCalculation(' + ');
        ">+</button>
      </p>

      <p>
        <button class="button1" onclick="
          updateCalculation('4');
        ">4</button>

        <button class="button1" onclick="
          updateCalculation('5');
        ">5</button>

        <button class="button1" onclick="
          updateCalculation('6');
        ">6</button>
      
        <button class="button2" onclick="
          updateCalculation(' - ');
        ">-</button>
      </p>

      <p>
        <button class="button1" onclick="
          updateCalculation('7');
        ">7</button>

        <button class="button1" onclick="
          updateCalculation('8');
        ">8</button>

        <button class="button1" onclick="
          updateCalculation('9');
        ">9</button>
      
        <button class="button2" onclick="
          updateCalculation(' * ');
        ">*</button>
      </p>

      <p>
        <button class="button1" onclick="
          updateCalculation('0');
        ">0</button>

        <button class="button1" onclick="
          updateCalculation('.');
        ">.</button>

        <button class="button1" onclick="
          updateCalculation('=');
        ">=</button>
      
        <button class="button2" onclick="
          updateCalculation(' / ');
        ">/</button>
      </p>

      <p>
        <button class="button3" onclick="
          updateCalculation('clear');
        ">Clear</button>

        <button class="button3" onclick="deleteLastCharacter();">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </p>
      

    </div>

    <script src="scripts/script.js"></script>
  </body>
</html>
